[project]
name = "claude-session-cache"
version = "0.1.0"
description = "Local searchable SQLite cache of Claude Code sessions, exposed over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
claude-session-cache = "claude_session_cache.cli:main"
# Same package, own name: macOS labels a background item after the program it runs, so the
# scheduled sync needs its own console script to be tellable apart from the indexer.
claude-session-sync = "claude_session_cache.cli:sync_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_session_cache"]

[tool.ruff]
line-length = 110
target-version = "py311"
